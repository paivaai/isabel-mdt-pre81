name: Cartas escaneadas do IBGE (inventário)
# Lista editoradas/ e fotolitos/ do IBGE, baixa as folhas da região e gera o inventário.
on:
  workflow_dispatch:
jobs:
  cartas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils || true
      - run: pip install -e .
      - run: python -m mdt_pre81 cartas 2>&1 | tee inventario_cartas.txt
        env:
          PYTHONUNBUFFERED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: cartas-ibge
          path: |
            inventario_cartas.txt
            data/cartas_raster/
          if-no-files-found: warn
