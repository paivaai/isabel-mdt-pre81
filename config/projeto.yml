# Configuração do projeto. Caminhos relativos à raiz do repositório.
entradas:
  landsat: data/LM02_melhorada_UTM.tif          # cena Landsat 2 MSS (ago/1979) em GeoTIFF
  natd: data/NA_TD_TOTAL.zip              # .shp, .zip ou .rar (áreas de referência ao longo do rio)
  curvas: data/curvas_cartas.gpkg         # curvas das cartas antigas (campo 'cota'); se não existir, baixa do IBGE
  pontos: null                            # pontos cotados opcionais (campo numérico de cota)
  aoi: null                               # opcional: polígono da região de estudo (substitui municípios)

area:
  municipios: [Buritama, Zacarias]
  margem_km: 3.0
  fallback_km: 12.0                       # sem internet: AOI = NA_TD + este buffer
  baixar_limites_ibge: true

landsat:
  melhorar: false                         # false = a imagem de entrada já está melhorada (não repete)
  upscale: 2
  gama: 0.95
  saturacao: 1.25
  clahe_clip: 0.004
  nitidez: 0.8

drenagem:
  modo: todas
  ajuste_limiar: 1.0
  area_min_px: 12
  compr_min_px: 15

# Imagens históricas: extrai o rio/drenagem de cada ano e plota no webmap (imagem, água e linhas, desligáveis).
# crs: deixe null se o TIF já é georreferenciado; para TIFF + .tfw sem CRS informe (ex.: "EPSG:31982", "EPSG:22522")
# ou deixe null para deduzir pela AOI (confira no log).
# Método padrão = TRAÇADO do curso d'água (linha central de faixa escura FINA e contínua ligada ao rio principal).
# Ajustes opcionais por imagem: largura_max_m (250), comp_min_m (1500), laco_max_por_km (1.2), ponte_m (250),
# q_baixo/q_alto (90/97: sensibilidade), corredor_km (3). Método antigo (manchas): metodo: manchas.
historicas:
  - {id: "1973", rotulo: "1973", arquivo: data/IMAGEM_1973_A.tif, crs: null, cor: "#ffd60a", px_max: 7000}
  - {id: "1967", rotulo: "1967", arquivo: data/IMAGEM_67_Bebel.tif, crs: null, cor: "#ff7b00", px_max: 7000}

curvas:
  baixar_ibge: true                       # tenta cartas vetoriais 1:50.000 do IBGE se o arquivo acima não existir
  crs_origem: "EPSG:22522"                # datum ORIGINAL da carta: Córrego Alegre UTM 22S (ou EPSG:29192 SAD69)
  campo_cota: null                        # null = detecta (cota/elevacao/altitude/Z...)
  resolucao_m: 30
  suavizar: 1.0
  dist_max_curva_m: 1500                  # além disso a célula fica SEM DADOS
  usar_drenagem_no_talvegue: true

saidas:
  pasta: outputs

webmap:
  titulo: "Projeto Isabel — MDT pré-1981 (Buritama/Zacarias)"
  resumo: "Landsat 1979, drenagem e MDT derivado de cartas topográficas antigas, sobre imagem atual."
  pasta_site: docs                        # publicado pelo GitHub Pages
  standalone: true                        # também gera outputs/webmap_standalone.html (arquivo único)
  # Camadas WMS (DESLIGADAS por padrão; ligue no painel). BDGEx = Exército (DSG), para bater com a base do IBGE.
  # ATENÇÃO: o serviço não informa o ano de cada folha: confira a data de edição na legenda da carta.
  wms:
    - {nome: "BDGEx – Carta Topográfica 1:50.000 (Exército)", url: "https://bdgex.eb.mil.br/teogc/50/terraogcmed.cgi", layers: "ctm", versao: "1.1.1", atribuicao: "BDGEx/DSG – Exército Brasileiro"}
    - {nome: "BDGEx – Carta Topográfica 1:25.000 (Exército)", url: "https://bdgex.eb.mil.br/teogc/25/terraogcmed.cgi", layers: "ctm", versao: "1.1.1", atribuicao: "BDGEx/DSG – Exército Brasileiro"}
    - {nome: "BDGEx – Carta Topográfica 1:100.000 (Exército)", url: "https://bdgex.eb.mil.br/teogc/100/terraogcmed.cgi", layers: "ctm", versao: "1.1.1", atribuicao: "BDGEx/DSG – Exército Brasileiro"}
  # Cartas escaneadas (PDF/TIF) sem georreferência: informe crs e bounds [Emin, Nmin, Emax, Nmax] do desenho.
  # As que já vierem georreferenciadas (GeoTIFF/GeoPDF) entram sozinhas. Ex.:
  # cartas: [{nome: "Buritama MI 2633-2", arquivo: data/cartas_raster/buritama.pdf, crs: "EPSG:22522", bounds: [E0, N0, E1, N1]}]
  cartas: []
